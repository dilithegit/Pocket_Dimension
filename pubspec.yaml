name: pocket_dimension
description: "Pocket Dimension - An AI-powered omnipotent God-Mode RPG."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.1
  sqflite: 2.3.3+2
  path_provider: ^2.1.3
  path: ^1.9.0
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/stories/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#F0D9B0"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#2D1418"
  image: "assets/icons/app_icon_foreground.png"
  android_12:
    color: "#2D1418"
    image: "assets/icons/app_icon_foreground.png"

